<!doctype html>
<!--
  This file is NOT the app UI. It exists only because Tauri's config schema
  requires `build.frontendDist` to point at a real directory of static
  assets. The actual app is the existing Next.js frontend, loaded from
  http://localhost:3000 at runtime (see `app.windows[0].url` and
  `build.devUrl` in ../tauri.conf.json) — nothing here is rendered except
  for a brief instant before that navigation happens, or if the app ever
  fails to reach the Next.js server.
-->
